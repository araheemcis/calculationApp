apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calculationappingress
  namespace: default
  annotations:
spec:
  ingressClassName: nginx
  rules:
  - host: "calculationapps.com"
    http:
      paths:
      - pathType: Prefix
        path: "/calculationApp/"
        backend:
          service:
            name: calculationapp2
            port:
              number: 8080
      


